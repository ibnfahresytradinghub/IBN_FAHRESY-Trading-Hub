<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Advanced SBI 1.0 - Group Access</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="header">

    <a href="index.html" class="logo">

        <img src="images/logo.jpg"
             alt="IBN_FAHRESY Trading Hub Logo">

        <span>IBN_FAHRESY</span>

    </a>

    <a href="index.html"
       class="back-home">
        ← Back Home
    </a>

</header>


<section class="application-section">

    <div class="application-container">

        <div class="application-heading">

            <p class="section-label">
                GROUP ACCESS
            </p>

            <h1>
                Advanced SBI 1.0
                <span>Group Access Agreement</span>
            </h1>

            <p>
                Complete the form below to apply for access to the
                Advanced SBI 1.0 Group.
            </p>

        </div>


        <form id="groupForm">

            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input type="text"
                       name="fullName"
                       placeholder="Enter your full name"
                       required>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>
                        Email Address
                    </label>

                    <input type="email"
                           name="email"
                           placeholder="Enter your email"
                           required>

                </div>


                <div class="form-group">

                    <label>
                        WhatsApp Number
                    </label>

                    <input type="tel"
                           name="whatsapp"
                           placeholder="Enter WhatsApp number"
                           required>

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>
                        Country
                    </label>

                    <input type="text"
                           name="country"
                           placeholder="Your country"
                           required>

                </div>


                <div class="form-group">

                    <label>
                        Trading Experience
                    </label>

                    <select name="experience" required>

                        <option value="">
                            Select experience
                        </option>

                        <option>
                            Beginner
                        </option>

                        <option>
                            Less than 1 year
                        </option>

                        <option>
                            1 - 3 years
                        </option>

                        <option>
                            More than 3 years
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-group">

                <label>
                    Why do you want to join this program?
                </label>

                <textarea name="reason"
                          rows="5"
                          placeholder="Tell us briefly..."
                          required></textarea>

            </div>


            <div class="agreement-box">

                <label>

                    <input type="checkbox"
                           required>

                    I confirm that the information provided
                    is correct and I agree to the terms of
                    the Advanced SBI 1.0 Group Access program.

                </label>

            </div>


            <a href="register.html?program=group" class="submit-btn" style="display:block;text-align:center;text-decoration:none;">CONTINUE TO PAYMENT</a>

        </form>

    </div>

</section>


<script src="script.js"></script>

</body>

</html>
