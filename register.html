<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | IBN FAHRESY TRADING ACADEMY</title>
    <meta name="description" content="Register for IBN FAHRESY Trading Academy programs. Join our professional trading education with mentorship and signals.">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0f0d;
            color: #e0e6e3;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            background: 
                linear-gradient(rgba(22, 199, 132, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(22, 199, 132, 0.03) 1px, transparent 1px),
                radial-gradient(ellipse at 30% 40%, rgba(22, 199, 132, 0.05), transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(0, 150, 255, 0.03), transparent 40%),
                #0a0f0d;
            background-size: 30px 30px, 30px 30px, 100% 100%, 100% 100%;
            pointer-events: none;
        }
        .register-card {
            position: relative;
            z-index: 2;
            background: rgba(11, 23, 17, 0.95);
            border: 1px solid rgba(22, 199, 132, 0.2);
            border-radius: 20px;
            padding: 40px;
            max-width: 480px;
            width: 92%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            backdrop-filter: blur(20px);
        }
        .logo-text {
            text-align: center;
            margin-bottom: 10px;
        }
        .logo-text h1 {
            color: #16c784;
            font-size: 28px;
            letter-spacing: 1px;
        }
        .logo-text p {
            color: #9db0a9;
            font-size: 13px;
        }
        .program-badge {
            background: rgba(22, 199, 132, 0.1);
            border: 1px solid rgba(22, 199, 132, 0.2);
            border-radius: 10px;
            padding: 12px 15px;
            text-align: center;
            margin-bottom: 25px;
        }
        .program-badge span {
            color: #16c784;
            font-weight: 700;
            font-size: 15px;
        }
        .program-badge small {
            color: #6b7f77;
            font-size: 12px;
            display: block;
            margin-top: 3px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            color: #b7c2bc;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px 16px;
            background: rgba(7, 16, 12, 0.8);
            color: #fff;
            border: 1px solid rgba(22, 199, 132, 0.15);
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: #16c784;
            outline: none;
            box-shadow: 0 0 20px rgba(22, 199, 132, 0.08);
        }
        .form-group input::placeholder {
            color: #4a5a52;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #16c784, #0fa968);
            color: #001b0d;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(22, 199, 132, 0.2);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(22, 199, 132, 0.35);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-primary.loading {
            position: relative;
            pointer-events: none;
        }
        .btn-primary.loading::after {
            content: '';
            display: inline-block;
            width: 18px;
            height: 18px;
            margin-left: 12px;
            border: 2px solid #001b0d;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
        .error { color: #dc2626; }
        .success { color: #16c784; }
        .info { color: #60a5fa; }
        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #6b7f77;
        }
        .login-link a {
            color: #16c784;
            text-decoration: none;
            font-weight: 600;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
        .terms {
            font-size: 12px;
            color: #6b7f77;
            text-align: center;
            margin-top: 15px;
            line-height: 1.6;
        }
        .terms a {
            color: #16c784;
            text-decoration: none;
        }
        #registerQuote {
            transition: opacity 0.6s ease;
        }
        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .register-card {
                padding: 25px 18px;
            }
        }
    </style>
</head>
<body>

<div class="register-card">
    <div class="logo-text">
        <h1>📊 IBN_FAHRESY</h1>
        <p>Join the academy. Start your trading journey.</p>
    </div>

    <!-- ROTATING MOTIVATION QUOTES -->
    <div style="text-align: center; padding: 12px 15px; background: rgba(22, 199, 132, 0.05); border-radius: 10px; margin-bottom: 20px; border-left: 3px solid #16c784;">
        <p id="registerQuote" style="color: #bccac4; font-size: 13px; font-style: italic; margin: 0;">
            📚 "<span style="color: #16c784; font-weight: 700;">Knowledge is the only thing</span> 
            <span style="color: #ffd700;">that compounds without risk.</span>"
        </p>
    </div>

    <div class="program-badge">
        <span id="programDisplay">Loading program...</span>
        <small id="amountDisplay">Amount: $0</small>
    </div>

    <form id="registerForm" onsubmit="registerStudent(event)">
        <div class="form-group">
            <label>🔑 Telegram Username</label>
            <input type="text" id="telegramUsername" placeholder="@yourusername" required>
            <small style="color:#4a5a52;font-size:11px;">Enter without @</small>
        </div>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="fullName" placeholder="Enter your full name" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Email (Optional)</label>
                <input type="email" id="email" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="tel" id="phone" placeholder="Phone number">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Country</label>
                <input type="text" id="country" placeholder="Your country">
            </div>
            <div class="form-group">
                <label>State</label>
                <input type="text" id="state" placeholder="Your state">
            </div>
        </div>

        <div class="form-group">
            <label>Gender</label>
            <select id="gender">
                <option value="">Select gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Prefer not to say">Prefer not to say</option>
            </select>
        </div>

        <div class="form-group">
            <label>🔑 Create Password</label>
            <input type="password" id="password" placeholder="Min 6 characters" required minlength="6">
        </div>

        <input type="hidden" id="selectedProgram" value="">

        <button type="submit" class="btn-primary" id="registerBtn">
            🚀 Register & Continue to Payment
        </button>

        <div id="message" class="message"></div>

        <div class="login-link">
            Already have an account? <a href="student-login.html">Login here</a>
        </div>

        <div class="terms">
            By registering, you agree to our 
            <a href="terms.html">Terms & Conditions</a>
        </div>
    </form>
</div>

<script>
    const SUPABASE_URL = "https://symuzfndzqjrtavqfoqy.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_7xhQ-vLiJIMpeFgvMR3q0Q_QVIQNb1Q";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    // =============================================
    //   ROTATING MOTIVATION QUOTES
    // =============================================

    const registerQuotes = [
        '📚 "<span style="color: #16c784; font-weight: 700;">Knowledge is the only thing</span> <span style="color: #ffd700;">that compounds without risk.</span>"',
        '🎯 "<span style="color: #16c784; font-weight: 700;">The best investment you can make</span> <span style="color: #ffd700;">is in your trading education.</span>"',
        '⏳ "<span style="color: #16c784; font-weight: 700;">Patience is not about waiting</span> <span style="color: #ffd700;">it\'s about waiting with purpose.</span>"',
        '📈 "<span style="color: #16c784; font-weight: 700;">Price action is the language</span> <span style="color: #ffd700;">of the market. Learn to speak it fluently.</span>"',
        '💪 "<span style="color: #16c784; font-weight: 700;">Every loss is a lesson</span> <span style="color: #ffd700;">Every lesson is a step forward.</span>"',
        '🌟 "<span style="color: #16c784; font-weight: 700;">The trend is your friend</span> <span style="color: #ffd700;">Respect it, and it will respect you.</span>"',
        '🔍 "<span style="color: #16c784; font-weight: 700;">Smart Money leaves footprints</span> <span style="color: #ffd700;">Learn to follow them.</span>"',
        '🏆 "<span style="color: #16c784; font-weight: 700;">Trading is not about being right</span> <span style="color: #ffd700;">It\'s about being profitable.</span>"',
        '🛡️ "<span style="color: #16c784; font-weight: 700;">Discipline is the bridge</span> <span style="color: #ffd700;">between your goals and your success.</span>"',
        '🧠 "<span style="color: #16c784; font-weight: 700;">The best traders are not the smartest</span> <span style="color: #ffd700;">They are the most disciplined.</span>"'
    ];

    let registerQuoteIndex = 0;
    const registerQuoteElement = document.getElementById('registerQuote');

    if (registerQuoteElement) {
        setInterval(() => {
            registerQuoteElement.style.opacity = '0';
            setTimeout(() => {
                registerQuoteIndex = (registerQuoteIndex + 1) % registerQuotes.length;
                registerQuoteElement.innerHTML = registerQuotes[registerQuoteIndex];
                registerQuoteElement.style.opacity = '1';
            }, 400);
        }, 5000);
    }

    // =============================================
    //   LOAD PROGRAM PRICES FROM DATABASE
    // =============================================

    document.addEventListener('DOMContentLoaded', function() {
        loadRegisterPrices();
    });

    async function loadRegisterPrices() {
        try {
            const urlParams = new URLSearchParams(window.location.search);
            const program = urlParams.get('program');
            const month = urlParams.get('month');
            
            if (!program) {
                document.getElementById('programDisplay').innerText = 'Trading Program';
                document.getElementById('amountDisplay').innerText = 'Amount: $0';
                return;
            }

            // Fetch program price from Supabase
            const { data: programs, error } = await supabaseClient
                .from('programs')
                .select('*')
                .eq('type', program)
                .eq('is_active', true);

            let price = 0;
            let displayName = '';

            if (error || !programs || programs.length === 0) {
                // Fallback if not found in database
                if (program === 'group') { price = 25; displayName = 'Advanced SBI Group Access'; }
                else if (program === 'mentorship') { price = 100; displayName = 'Advanced SBI 1-on-1 Mentorship'; }
                else if (program === 'signals') { price = 30; displayName = 'Trading Signals Group'; }
                else { price = 0; displayName = program; }
            } else {
                const prog = programs[0];
                price = prog.price_usd || 0;
                displayName = prog.name;
            }

            // Build the display name with month for signals
            let finalDisplay = displayName;
            if (program === 'signals' && month) {
                finalDisplay = `Signals Group - ${month}`;
            }

            // Update the page
            document.getElementById('programDisplay').innerText = finalDisplay + ' ($' + price + ')';
            document.getElementById('amountDisplay').innerText = 'Amount: $' + price;
            document.getElementById('selectedProgram').value = finalDisplay;

        } catch (error) {
            console.error('Error loading prices:', error);
            document.getElementById('programDisplay').innerText = 'Trading Program';
            document.getElementById('amountDisplay').innerText = 'Amount: $0';
        }
    }

    // =============================================
    //   STUDENT REGISTRATION
    // =============================================

    async function registerStudent(event) {
        event.preventDefault();

        const username = document.getElementById('telegramUsername').value.trim().replace('@', '');
        const fullName = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const country = document.getElementById('country').value.trim();
        const state = document.getElementById('state').value.trim();
        const gender = document.getElementById('gender').value;
        const password = document.getElementById('password').value;
        const selectedProgram = document.getElementById('selectedProgram').value;

        const message = document.getElementById('message');
        const btn = document.getElementById('registerBtn');

        if (!username || !fullName || !password) {
            message.className = 'message error';
            message.innerText = 'Please fill in all required fields.';
            return;
        }

        if (password.length < 6) {
            message.className = 'message error';
            message.innerText = 'Password must be at least 6 characters.';
            return;
        }

        btn.disabled = true;
        btn.className = 'btn-primary loading';
        btn.innerText = 'Creating account...';
        message.className = 'message';
        message.innerText = '';

        try {
            // Check if user already exists
            const { data: existing, error } = await supabaseClient
                .from('students')
                .select('telegram_username')
                .eq('telegram_username', username)
                .maybeSingle();

            if (existing) {
                message.className = 'message error';
                message.innerText = 'This Telegram username is already registered. Please login.';
                btn.disabled = false;
                btn.className = 'btn-primary';
                btn.innerText = '🚀 Register & Continue to Payment';
                return;
            }

            // Hash the password
            const hashedPassword = btoa(password + 'ibn_fahresy_salt');

            // Create student
            const { data: student, error: insertError } = await supabaseClient
                .from('students')
                .insert({
                    telegram_username: username,
                    email: email || null,
                    full_name: fullName,
                    phone: phone || null,
                    country: country || null,
                    state: state || null,
                    gender: gender || null,
                    selected_program: selectedProgram,
                    password_hash: hashedPassword,
                    telegram_verified: false
                })
                .select('id')
                .single();

            if (insertError) {
                throw new Error('Could not create account: ' + insertError.message);
            }

            // Create enrollment
            const { error: enrollmentError } = await supabaseClient
                .from('enrollments')
                .insert({
                    student_id: student.id,
                    program_name: selectedProgram,
                    cohort: '2026',
                    payment_status: 'pending',
                    academy_status: 'pending',
                    telegram_status: 'pending',
                    certificate_status: 'pending',
                    registration_date: new Date().toISOString()
                });

            if (enrollmentError) {
                console.error('Enrollment error:', enrollmentError);
            }

            // Save session
            sessionStorage.setItem('studentId', student.id);
            sessionStorage.setItem('telegramUsername', username);
            sessionStorage.setItem('studentName', fullName);
            sessionStorage.setItem('selectedProgram', selectedProgram);

            message.className = 'message success';
            message.innerText = '✅ Account created! Redirecting to payment...';

            btn.disabled = false;
            btn.className = 'btn-primary';
            btn.innerText = '🚀 Register & Continue to Payment';

            // Redirect to payment
            setTimeout(function() {
                window.location = 'payment.html?program=' + encodeURIComponent(selectedProgram) + '&username=' + encodeURIComponent(username);
            }, 300);

        } catch (error) {
            message.className = 'message error';
            message.innerText = 'Error: ' + error.message;
            btn.disabled = false;
            btn.className = 'btn-primary';
            btn.innerText = '🚀 Register & Continue to Payment';
        }
    }
</script>

</body>
</html>
